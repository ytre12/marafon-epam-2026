@if ((label() ?? '').length > 0) {
  <label class="password-label" [for]="inputId" [class.focused]="passwordFocused()">
    {{ label() | translate }}
  </label>
}

<div class="password-wrapper">
  <input
    [id]="inputId"
    [type]="showPassword() ? 'text' : 'password'"
    [formControl]="control()"
    [placeholder]="placeholder() | translate"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />
  <button type="button" class="toggle-icon" (click)="toggleShowPassword()">
    <img [src]="showPassword() ? 'assets/svg/eye_closed.svg' : 'assets/svg/eye.svg'" [alt]="'eye' | translate" />
  </button>
</div>
