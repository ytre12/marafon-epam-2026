<app-password
  [control]="control()"
  [label]="('Confirm New Password' | translate)"
  [placeholder]="('Confirm your Password' | translate)"
>
</app-password>

<li
  class="requirement-item requirement-item-cinfirm"
  [ngClass]="{
    valid:
      control()?.value &&
      !control()?.errors?.['passwordMismatch'] &&
      (control()?.touched || control()?.dirty),
    invalid: control()?.errors?.['passwordMismatch'] && (control()?.touched || control()?.dirty),
  }"
>
  Confirm password must match new password
</li>
