<app-modal [title]="'Review & Confirm Reservation' | translate" (closed)="onClose()">
  <dl class="info">
    <div class="info-row">
      <dt>{{ 'Location' | translate }}</dt>
      <dd>{{ locationName() }}</dd>
    </div>
    <div class="info-row">
      <dt>{{ 'Date' | translate }}</dt>
      <dd>{{ date() | localizedDate: 'MMM d, y' }}</dd>
    </div>
    <div class="info-row">
      <dt>{{ 'Time' | translate }}</dt>
      <dd>{{ timeLabel() }}</dd>
    </div>
    <div class="info-row">
      <dt>{{ 'Guests' | translate }}</dt>
      <dd>{{ guestsLabel() }}</dd>
    </div>
  </dl>

  <p class="note">{{ 'You can cancel up to 30 min before your reservation.' | translate }}</p>

  <div modal-actions class="actions">
    <button
      type="button"
      class="button button--secondary button--extra-large edit-btn"
      (click)="onEdit()"
    >
      {{ 'Edit' | translate }}
    </button>
    <button
      type="button"
      class="button button--primary button--extra-large confirm-btn"
      [disabled]="submitting()"
      (click)="onConfirm()"
    >
      {{ 'Confirm' | translate }}
    </button>
  </div>
</app-modal>
