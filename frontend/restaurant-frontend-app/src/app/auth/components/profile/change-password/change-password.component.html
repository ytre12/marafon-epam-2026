<form
  class="card password-card"
  [formGroup]="passwordForm"
  (ngSubmit)="onChangePassword()"
>
  <app-password
    [control]="oldPassword"
    [label]="'Old Password' | translate"
    [placeholder]="'Enter your old password' | translate"
  />

  <app-password-with-rules
    class="password"
    [control]="password"
    [label]="'Password' | translate"
    [placeholder]="'Enter your new password' | translate"
  />

  <app-confirm-password
    class="password"
    [control]="confirmPassword"
  />

  <button
    type="submit"
    class="button button--primary button--large save-button"
    [disabled]="passwordForm.invalid"
  >
    {{ 'Save Changes' | translate }}
  </button>
</form>
